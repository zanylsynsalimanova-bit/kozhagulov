<meta charset="utf-8">

<title>Кожагулов М.С. · Химия пәні мұғалімі</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef3f1;--paper:#f8fbfa;--ink:#10232a;--mute:#5d7178;--deep:#0b1c22;--acc:#1fb59a;--acc2:#7ee8d2;--amber:#f0a83c;--line:#d6e2df;
--serif:"Cormorant Garamond",Georgia,serif;--sans:Inter,system-ui,"Segoe UI",sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font:16px/1.6 var(--sans);overflow-x:hidden}
img{display:block;max-width:100%}
em{font-style:italic;color:var(--acc)}
.dark em{color:var(--acc2)}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:0 24px}
.k{font:600 12px/1 var(--sans);letter-spacing:.18em;text-transform:uppercase;color:var(--acc)}
h1,h2{font-family:var(--serif);font-weight:500;line-height:1.05}
h2{font-size:clamp(34px,5vw,58px);margin:14px 0 26px}
section{padding:110px 0;position:relative}
.dark{background:var(--deep);color:#e3efec}.dark .mute{color:#93aaa6}
.mute{color:var(--mute)}
.num{font:500 13px var(--sans);color:var(--acc);letter-spacing:.1em}

#nav{position:fixed;inset:0 0 auto;z-index:50;display:flex;align-items:center;gap:20px;padding:14px 24px;transition:.3s}
#nav.solid{background:rgba(11,28,34,.9);backdrop-filter:blur(10px)}
#nav .nm{font:600 20px var(--serif);color:#eaf6f3;margin-right:auto;white-space:nowrap}
#nav .links{display:flex;gap:18px}
#nav .links a{color:#d4e6e2;text-decoration:none;font-size:13px;opacity:.8}
#nav .links a:hover{opacity:1;color:var(--acc2)}
.lang{display:flex;border:1px solid rgba(126,232,210,.45);border-radius:99px;overflow:hidden}
.lang button{padding:5px 11px;font-size:12px;color:#d4e6e2}
.lang button.on{background:var(--acc);color:#fff}
.btn{display:inline-flex;align-items:center;gap:8px;padding:12px 22px;border-radius:99px;background:var(--acc);color:#fff;font-weight:600;font-size:14px;text-decoration:none;transition:.2s}
.btn:hover{background:#17977f}
#nav .btn{padding:8px 16px;font-size:13px}
@media(max-width:900px){#nav .links{display:none}}

#hero{min-height:100vh;padding:0;display:flex;align-items:center;color:#fff;overflow:hidden;background:radial-gradient(1200px 700px at 75% 40%,#14414a 0%,#0b1c22 60%)}
#mol{position:absolute;inset:0;width:100%;height:100%}
#hero .wrap{position:relative;z-index:2;width:100%;display:grid;grid-template-columns:1.25fr .75fr;gap:50px;align-items:center}
#hero .in{padding:110px 0 60px}
#hero h1{font-size:clamp(44px,6.2vw,84px);margin:18px 0 14px}
#hero h1 span{display:block;font-size:.5em;color:var(--acc2);font-style:italic}
#hero .sub{color:#cfe3df;font-size:17px}
.motto{font:italic 500 24px/1.35 var(--serif);color:#e6f4f1;margin:28px 0 34px;padding-left:18px;border-left:2px solid var(--acc)}
.photo{aspect-ratio:3/4;border-radius:220px 220px 24px 24px;overflow:hidden;border:1px solid rgba(126,232,210,.35);box-shadow:0 40px 80px -30px rgba(0,0,0,.6)}
.photo img{width:100%;height:100%;object-fit:cover;object-position:60% 40%}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:rgba(126,232,210,.2);margin-top:50px;border-radius:14px;overflow:hidden}
.stats div{background:rgba(11,28,34,.65);padding:16px 14px}
.stats b{display:block;font:500 36px/1 var(--serif);color:var(--acc2)}
.stats span{font-size:12px;color:#b9d0cb;line-height:1.3;display:block;margin-top:6px}
@media(max-width:800px){#hero .wrap{grid-template-columns:1fr}.photo{max-width:280px;margin-bottom:60px}.stats{grid-template-columns:repeat(2,1fr)}}

.credo{display:grid;grid-template-columns:1fr 1fr;gap:28px}
.credo article{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:36px}
.credo p{font:500 25px/1.4 var(--serif);margin-top:14px}
.credo .pic{grid-row:span 2;border-radius:20px;overflow:hidden;cursor:zoom-in}
.credo .pic img{width:100%;height:100%;object-fit:cover}
.credo{grid-template-columns:.8fr 1fr}
@media(max-width:800px){.credo{grid-template-columns:1fr}.credo .pic{grid-row:auto;aspect-ratio:4/3}}

.crit{display:grid;gap:18px}
.cr{display:grid;grid-template-columns:90px 1fr 220px;gap:30px;align-items:center;padding:26px 28px;border-radius:22px;background:rgba(255,255,255,.04);border:1px solid rgba(126,232,210,.16);transition:.3s}
.cr:hover{border-color:rgba(126,232,210,.5)}
.cr .n{font:500 60px/1 var(--serif);color:var(--acc2)}
.cr h3{font:500 30px/1.15 var(--serif);color:#fff}
.cr p{color:#d6e8e4;font:italic 500 21px/1.35 var(--serif);margin-top:8px}
.cr img{border-radius:12px;aspect-ratio:4/3;object-fit:cover;width:100%;cursor:zoom-in;background:#fff}
@media(max-width:860px){.cr{grid-template-columns:1fr;gap:12px}.cr .n{font-size:44px}}

.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;overflow:hidden;text-align:left;cursor:zoom-in;transition:.25s}
.card:hover{transform:translateY(-4px);box-shadow:0 18px 36px -18px rgba(0,0,0,.35)}
.dark .card{background:#12292f;border-color:#1f3c43;color:#e3efec}
.card .ph{aspect-ratio:4/3;overflow:hidden;background:#fff}
.card .ph img{width:100%;height:100%;object-fit:cover;object-position:top}
.card .cap{padding:12px 14px;font-size:13.5px;line-height:1.4}
.card .cap b{display:flex;justify-content:space-between;font:600 10.5px var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--acc);margin-bottom:5px}
.card .cap strong{font:600 18px var(--serif);display:block}
.filt{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px}
.filt button{padding:8px 16px;border-radius:99px;border:1px solid var(--line);font-size:13px;background:var(--paper)}
.filt button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.hide{display:none}

.tl{display:grid;gap:0;border-left:2px solid rgba(126,232,210,.3);margin:0 0 40px 8px}
.tl div{padding:0 0 22px 26px;position:relative}
.tl div::before{content:"";position:absolute;left:-7px;top:6px;width:12px;height:12px;border-radius:50%;background:var(--acc2)}
.tl b{font:500 26px var(--serif);color:var(--acc2);margin-right:10px}
.tl span{color:#d6e8e4}
.tl small{display:block;color:#93aaa6;font-size:13px}

footer{padding:70px 0;text-align:center}
footer .sig{font:italic 500 30px var(--serif);color:var(--acc2);margin-bottom:12px}

#lb{position:fixed;inset:0;z-index:100;background:rgba(5,12,15,.95);display:none;align-items:center;justify-content:center;flex-direction:column;padding:30px}
#lb.on{display:flex}
#lb img{max-width:94vw;max-height:82vh;border-radius:6px;object-fit:contain;background:#fff}
#lb p{color:#d6e8e4;margin-top:14px;font-size:15px;text-align:center;max-width:800px}
#lb .x{position:absolute;top:14px;right:20px;font-size:34px;color:#fff}
#lb .ar{position:absolute;top:50%;font-size:44px;color:#fff;opacity:.7;padding:20px}
#lb .ar:hover{opacity:1}#lb .pv{left:6px}#lb .nx{right:6px}

#pres{position:fixed;left:50%;bottom:18px;transform:translate(-50%,140%);z-index:60;display:flex;align-items:center;gap:14px;background:rgba(11,28,34,.95);color:#e3efec;padding:10px 12px 10px 20px;border-radius:99px;box-shadow:0 10px 40px rgba(0,0,0,.4);transition:.4s;max-width:calc(100vw - 32px)}
#pres.on{transform:translate(-50%,0)}
#pres .clock{font:600 22px var(--sans);font-variant-numeric:tabular-nums;color:var(--acc2);min-width:62px}
#pres .clock.warn{color:#ff8a65}
#pres .step{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:240px}
#pres .step small{display:block;color:#93aaa6;font-size:11px}
#pres button{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.08);font-size:16px}
#pres button:hover{background:var(--acc)}
#bar{position:fixed;top:0;left:0;height:3px;background:var(--acc);z-index:70;width:0}
.reveal{opacity:0;transform:translateY(30px);transition:1s cubic-bezier(.2,.8,.2,1)}
.reveal.in{opacity:1;transform:none}
@media(prefers-reduced-motion:reduce){.reveal{opacity:1;transform:none}}
/* ===== 3D mode: dark glass over WebGL canvas ===== */
#gl{position:fixed;inset:0;width:100%;height:100%;z-index:0;display:block}
body{background:#081a1f;color:#e3efec}
main,footer{position:relative;z-index:1}
section,footer,#hero,#share,#students{background:transparent!important}
section{min-height:100vh;display:flex;align-items:center}
section>.wrap{width:100%}
.mute{color:#93aaa6}
.credo article,.card,.cr,.tl,.filt button{background:rgba(10,32,38,.6)!important;border:1px solid rgba(126,232,210,.18)!important;color:#e3efec;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.tl{padding:26px 20px 6px 30px;border-radius:20px;border-left:2px solid rgba(126,232,210,.3)!important;margin-left:0}
.filt button.on{background:var(--acc)!important;border-color:var(--acc)!important}
.card .ph{background:#fff}
.stats div{backdrop-filter:blur(10px)}
.scene-tag{position:fixed;right:22px;bottom:22px;z-index:2;font:600 11px var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--acc2);opacity:.75;pointer-events:none}
@media(max-width:800px){.scene-tag{display:none}}
</style>
</head>

<main>
<section id="hero" data-step="0" data-sec="35">

      <div class="stats">
        <div><b>9</b><span data-t="st0"></span></div>

      </div>

  </div>
</section>

<section id="credo" data-step="1" data-sec="35">
  <div class="wrap">
    <div class="k reveal"><span class="num">01</span> · <span data-t="credoK"></span></div>
    <h2 class="reveal" data-t="credoH"></h2>

      <article class="reveal"><div class="k" data-t="goalK"></div><p data-t="goal"></p></article>
    </div>
  </div>
</section>

<section id="crit" class="dark" data-step="2" data-sec="90">
  <div class="wrap">
    <div class="k reveal"><span class="num">02</span> · <span data-t="critK"></span></div>
    <h2 class="reveal" data-t="critH"></h2>
    <div class="crit" id="critList"></div>
  </div>
</section>

<section id="share" class="dark" style="background:#0f262c" data-step="3" data-sec="60">
  <div class="wrap">
    <div class="k reveal"><span class="num">03</span> · <span data-t="shK"></span></div>
    <h2 class="reveal" data-t="shH"></h2>
    <div class="tl" id="tl"></div>
    <div class="gal" id="gE"></div>
  </div>
</section>

<section id="awards" data-step="4" data-sec="50">
  <div class="wrap">
    <div class="k reveal"><span class="num">04</span> · <span data-t="aK"></span></div>
    <h2 class="reveal" data-t="aH"></h2>
    <div class="filt" id="filt"></div>
    <div class="gal" id="gA"></div>
  </div>
</section>

<section id="students" style="background:var(--paper)" data-step="5" data-sec="25">
  <div class="wrap">
    <div class="k reveal"><span class="num">05</span> · <span data-t="stK"></span></div>
    <h2 class="reveal" data-t="stH"></h2>
    <div class="gal" id="gS"></div>
  </div>
</section>
</main>

<footer class="dark" data-step="6" data-sec="5">
  <div class="wrap">
    <div class="sig" data-t="thanks"></div>
    <p class="mute" data-t="foot"></p>
  </div>
</footer>

<div id="lb"><button class="x" aria-label="close">×</button><button class="ar pv">‹</button><button class="ar nx">›</button><img id="lbI" alt=""><p id="lbT"></p></div>
<div id="pres"><div class="clock" id="clock">5:00</div><div class="step" id="pStep"></div>
  <button id="pPrev" aria-label="prev">↑</button><button id="pNext" aria-label="next">↓</button><button id="pEnd" aria-label="stop">■</button></div>

["2025",["Халықаралық ғылыми-практикалық конференция","Международная научно-практическая конференция"],["«Ауыл мектебінің қазіргі жағдайы», Астана–Павлодар","«Современное состояние сельской школы», Астана–Павлодар"]],
["2025",["Республикалық семинар, Ақтөбе","Республиканский семинар, Актобе"],["«Цифрлық ресурстарды пайдалану әдістері»","«Методы использования цифровых ресурсов»"]],
["2026",["Облыстық семинарлар, Ақтөбе","Областные семинары, Актобе"],["«Ауыл мектебі — сапа алаңы» жобасы","Проект «Сельская школа — площадка качества»"]],
["2026",["Ы. Алтынсарин академиясы — жұмыс тобы","Академия им. Ы. Алтынсарина — рабочая группа"],["Біріктірілген сыныптарда STEM бойынша әдістемелік ұсынымдар","Методические рекомендации по STEM для классов-комплектов"]]];
const EV=[["ev1",["Тамыз саммиті 2024 · бағдарлама","Августовский саммит 2024 · программа"]],["ev2",["Республикалық семинар 2025 · бағдарлама","Республиканский семинар 2025 · программа"]],["ev3",["Облыстық семинар 2026 · бағдарлама","Областной семинар 2026 · программа"]],["ev4",["Облыстық онлайн-семинар 23.01.2026","Областной онлайн-семинар 23.01.2026"]],["ev5",["STEM жұмыс тобы · бұйрық 2026","Рабочая группа STEM · приказ 2026"]]];
const AW=[["dip","reg","2021","Химия мұғалімдерінің облыстық пәндік олимпиадасы — III орын","Областная предметная олимпиада учителей химии — III место"],
["dip","dis","2020","«Дарынды балаларға — талантты ұстаз» олимпиадасы — II дәреже","Олимпиада «Одарённым детям — талантливый учитель» — II степень"],
["thx","dis","2021","Құрмет грамотасы, Қобда аудандық білім бөлімі","Почётная грамота, Кобдинский районный отдел образования"],
["cert","int","2023","57-ші Халықаралық Менделеев олимпиадасы: химия мұғалімдеріне семинар","57-я Международная Менделеевская олимпиада: семинар для учителей химии"],
["thx","rep","2024","«Өрлеу»: PISA республикалық конференциясы","«Өрлеу»: республиканская конференция по PISA"],
["thx","rep","2024","Ы. Алтынсарин академиясы: Тамыз саммитінің спикері","Академия им. Ы. Алтынсарина: спикер Августовского саммита"],
["thx","dis","2024","Аудандық Тамыз саммиті","Районный Августовский саммит"],
["thx","reg","2024","Ақтөбе облыстық әдістемелік орталығы","Актюбинский областной методический центр"],
["cert","int","2025","Халықаралық конференция «Ауыл мектебінің қазіргі жағдайы»","Международная конференция «Современное состояние сельской школы»"],
["thx","rep","2025","ҚР Оқу-ағарту министрлігі, Орта білім беру комитеті","Министерство просвещения РК, Комитет среднего образования"],
["cert","rep","2025","«Өрлеу»: «SMART-оқыту» курсы, 80 сағат","«Өрлеу»: курс «SMART-обучение», 80 часов"]];
const ST=[["Умиржанова Аружан","","reg",["I дәреже","I степень"],"2023",["«Аламан» облыстық олимпиадасы, химия","Областная олимпиада «Аламан», химия"]],
["Умиржанова Аружан","9","dis",["III орын","III место"],"2024",["«Аламан» олимпиадасы, аудандық кезең","Олимпиада «Аламан», районный этап"]],
["Елубаев Ұлан","10","dis",["III орын","III место"],"2020",["Республикалық пән олимпиадасы, химия, аудандық кезең","Республиканская олимпиада, химия, районный этап"]]];

let lang="kz";try{const s=localStorage.getItem("lang");if(s==="ru"||s==="kz")lang=s}catch(e){}
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],pad=i=>String(i+1).padStart(2,"0"),q=s=>s.replace(/"/g,"&quot;");
function render(){
  const t=T[lang],K=lang==="kz"?0:1;document.documentElement.lang=K?"ru":"kk";
  $$("[data-t]").forEach(e=>{const x=t[e.dataset.t];if(typeof x==="string")e.innerHTML=x});
  $$(".lang button").forEach(b=>b.classList.toggle("on",b.dataset.l===lang));
  $("#critList").innerHTML=CRIT.map((c,i)=>`<div class="cr reveal"><div class="n">0${i+1}</div><div><h3>${c[0][K]}</h3><p>${c[1][K]}</p></div><img class="z" src="img/${c[2]}.jpg" data-title="${q(c[0][K])}" alt="" loading="lazy"></div>`).join("");
  $("#tl").innerHTML=TL.map(x=>`<div class="reveal"><b>${x[0]}</b><span>${x[1][K]}</span><small>${x[2][K]}</small></div>`).join("");
  $("#gE").innerHTML=EV.map(e=>`<div class="card"><div class="ph"><img class="z" src="img/${e[0]}.jpg" data-title="${q(e[1][K])}" alt="" loading="lazy"></div><div class="cap">${e[1][K]}</div></div>`).join("");
  $("#filt").innerHTML=[["all",t.all],["dip",t.dip],["thx",t.thx],["cert",t.cert]].map((x,i)=>`<button data-f="${x[0]}" class="${i?"":"on"}">${x[1]}</button>`).join("");
  $("#gA").innerHTML=AW.map((a,i)=>`<div class="card" data-type="${a[0]}"><div class="ph"><img class="z" loading="lazy" src="img/a${pad(i)}.jpg" data-title="${a[2]} · ${q(a[3+K])}" alt=""></div><div class="cap"><b><span>${t.L[a[1]]}</span><span>${a[2]}</span></b>${a[3+K]}</div></div>`).join("");
  $("#gS").innerHTML=ST.map((s,i)=>`<div class="card"><div class="ph"><img class="z" loading="lazy" src="img/st${i+1}.jpg" data-title="${s[0]} — ${q(s[5][K])}" alt=""></div><div class="cap"><b><span>${s[3][K]} · ${t.L[s[2]]}</span><span>${s[4]}</span></b><strong>${s[0]}</strong>${s[1]?s[1]+" "+t.cls+" · ":""}${s[5][K]}</div></div>`).join("");
  $$("#filt button").forEach(b=>b.onclick=()=>{$$("#filt button").forEach(x=>x.classList.toggle("on",x===b));$$("#gA .card").forEach(c=>c.classList.toggle("hide",b.dataset.f!=="all"&&c.dataset.type!==b.dataset.f))});
  observe();if(presOn)pUpd();
}
$$(".lang button").forEach(b=>b.onclick=()=>{lang=b.dataset.l;try{localStorage.setItem("lang",lang)}catch(e){}render()});
let io;function observe(){io&&io.disconnect();io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target)}}),{threshold:.12});$$(".reveal:not(.in)").forEach(e=>io.observe(e))}
addEventListener("scroll",()=>{$("#nav").classList.toggle("solid",scrollY>40);const h=document.documentElement;$("#bar").style.width=(scrollY/(h.scrollHeight-innerHeight)*100)+"%"},{passive:true});

/* lightbox */
let lbList=[],lbI=0;
function lbShow(){const e=lbList[lbI];$("#lbI").src=e.src;$("#lbT").textContent=e.dataset.title||"";$("#lb").classList.add("on")}
function lbClose(){$("#lb").classList.remove("on")}
document.addEventListener("click",e=>{const c=e.target.closest(".card,.cr,.pic");const z=c?c.querySelector("img.z"):null;if(!z)return;
  const scope=z.closest(".gal,.crit");lbList=scope?[...scope.querySelectorAll("img.z")].filter(x=>!x.closest(".hide")):[z];lbI=lbList.indexOf(z);lbShow()});
$("#lb .x").onclick=lbClose;$("#lb").onclick=e=>{if(e.target.id==="lb")lbClose()};
$("#lb .pv").onclick=()=>{lbI=(lbI-1+lbList.length)%lbList.length;lbShow()};$("#lb .nx").onclick=()=>{lbI=(lbI+1)%lbList.length;lbShow()};

/* scene caption (bottom-right) */
const SCN=[["Кофеин C₈H₁₀N₄O₂","Кофеин C₈H₁₀N₄O₂"],["Атом құрылысы","Строение атома"],["Бензол C₆H₆","Бензол C₆H₆"],["NaCl кристалы","Кристалл NaCl"],["Менделеев кестесі","Таблица Менделеева"],["Су молекулалары H₂O","Молекулы воды H₂O"],["ДНҚ","ДНК"]];
$$("[data-step]").forEach((s,i)=>new IntersectionObserver(es=>{if(es[0].isIntersecting)$("#sceneTag").textContent="◆ "+SCN[i][lang==="kz"?0:1]},{threshold:.5}).observe(s));

/* 5-minute presentation mode */
const steps=$$("[data-step]");let presOn=false,cur=0,left=300,tick;
function go(i){cur=Math.max(0,Math.min(steps.length-1,i));steps[cur].scrollIntoView({behavior:"smooth"});pUpd()}
function pUpd(){$("#pStep").innerHTML=`${cur+1}/${steps.length} · ${T[lang].steps[cur]}<small>≈ ${steps[cur].dataset.sec} сек</small>`}
const fmt=s=>Math.floor(s/60)+":"+String(s%60).padStart(2,"0");
function presStart(){presOn=true;left=300;$("#pres").classList.add("on");$("#clock").textContent=fmt(left);$("#clock").classList.remove("warn");go(0);
  clearInterval(tick);tick=setInterval(()=>{left--;$("#clock").textContent=left>=0?fmt(left):"−"+fmt(-left);$("#clock").classList.toggle("warn",left<=30)},1000)}
function presEnd(){presOn=false;clearInterval(tick);$("#pres").classList.remove("on")}
$("#presBtn").onclick=()=>presOn?presEnd():presStart();
$("#pNext").onclick=()=>go(cur+1);$("#pPrev").onclick=()=>go(cur-1);$("#pEnd").onclick=presEnd;
addEventListener("keydown",e=>{if($("#lb").classList.contains("on")){if(e.key==="Escape")lbClose();if(e.key==="ArrowRight")$("#lb .nx").click();if(e.key==="ArrowLeft")$("#lb .pv").click();return}
  if(!presOn)return;if(["ArrowDown","PageDown"," ","ArrowRight"].includes(e.key)){e.preventDefault();go(cur+1)}if(["ArrowUp","PageUp","ArrowLeft"].includes(e.key)){e.preventDefault();go(cur-1)}if(e.key==="Escape")presEnd()});
steps.forEach(s=>new IntersectionObserver(es=>{if(es[0].isIntersecting&&presOn){cur=steps.indexOf(s);pUpd()}},{threshold:.35}).observe(s));
render();
</script>
<script type="module" src="scene3d.js"></script>
