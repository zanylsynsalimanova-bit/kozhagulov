<style>
:root{--deep:#071519;--ink:#e6f2ef;--mute:#93aaa6;--acc:#1fb59a;--acc2:#7ee8d2;--amber:#f0a83c;
--serif:"Cormorant Garamond",Georgia,serif;--sans:Inter,system-ui,"Segoe UI",sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--deep);color:var(--ink);font:16px/1.6 var(--sans);overflow-x:hidden}
img{display:block;max-width:100%}
em{font-style:italic;color:var(--acc2)}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
#gl{position:fixed;inset:0;width:100%;height:100%;z-index:0;display:block}
#flash{position:fixed;inset:0;z-index:1;pointer-events:none;opacity:0}
.chap{position:relative;z-index:0}
.k{font:600 12px/1 var(--sans);letter-spacing:.2em;text-transform:uppercase;color:var(--acc2)}
.ov{position:fixed;inset:0;z-index:2;display:flex;align-items:center;padding:90px 6vw 60px;opacity:0;visibility:hidden;pointer-events:none}
.ov.live{pointer-events:auto}
.col{max-width:520px}
.ov.right{justify-content:flex-end}
.ov h2{font:500 clamp(40px,5.6vw,78px)/1 var(--serif);margin:16px 0 22px}
.big{font:500 clamp(54px,9vw,140px)/.92 var(--serif);letter-spacing:-.01em}
.big span{display:block;font-style:italic;color:var(--acc2);font-size:.42em;margin-top:14px;letter-spacing:0}
.sub{color:#cfe3df;font-size:16px;margin-top:22px}
.stats{display:flex;gap:30px;margin-top:34px;flex-wrap:wrap}
.stats b{display:block;font:500 46px/1 var(--serif);color:var(--acc2)}
.stats span{font-size:12px;color:var(--mute)}
.hint{position:absolute;left:50%;bottom:26px;transform:translateX(-50%);font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--mute);text-align:center}
.hint i{display:block;width:1px;height:38px;margin:10px auto 0;background:linear-gradient(var(--acc2),transparent);animation:dr 1.8s infinite}
@keyframes dr{0%{transform:scaleY(0);transform-origin:top}50%{transform:scaleY(1);transform-origin:top}51%{transform-origin:bottom}100%{transform:scaleY(0);transform-origin:bottom}}
.quote{font:italic 500 clamp(26px,3vw,40px)/1.25 var(--serif)}
.lines{margin-top:26px;display:grid;gap:12px}
.lines p{padding-left:16px;border-left:2px solid var(--acc);color:#d6e8e4}
.av{width:110px;height:110px;border-radius:50%;object-fit:cover;object-position:60% 30%;border:2px solid var(--acc2);margin-bottom:22px}
.it{display:grid;grid-template-columns:52px 1fr;gap:14px;padding:14px 0;border-top:1px solid rgba(126,232,210,.18);opacity:0;transform:translateY(18px);transition:.6s cubic-bezier(.2,.8,.2,1)}
.it.on{opacity:1;transform:none}
.it b{font:500 34px/1 var(--serif);color:var(--acc2)}
.it h3{font:500 25px/1.15 var(--serif)}
.it p{font-size:14px;color:var(--mute);margin-top:4px}
.it small{font-size:13px;color:var(--mute)}
.thumbs{display:flex;gap:10px;margin-top:18px}
.thumbs img{width:74px;height:96px;object-fit:cover;object-position:top;border-radius:8px;background:#fff;cursor:zoom-in;opacity:.9}
.thumbs img:hover{opacity:1;transform:translateY(-3px)}
#ov4{flex-direction:column;justify-content:space-between;align-items:stretch;padding-bottom:7vh}
#ov4 .head{text-align:center}
.strip{display:flex;gap:18px;will-change:transform}
.card{flex:0 0 250px;background:rgba(10,32,38,.72);border:1px solid rgba(126,232,210,.2);border-radius:16px;overflow:hidden;backdrop-filter:blur(12px);cursor:zoom-in;text-align:left}
.card .ph{aspect-ratio:4/3;background:#fff;overflow:hidden}
.card .ph img{width:100%;height:100%;object-fit:cover;object-position:top}
.card .cap{padding:12px 14px;font-size:13px;line-height:1.4}
.card .cap b{display:flex;justify-content:space-between;font:600 10px var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--acc2);margin-bottom:5px}
.card .cap strong{font:600 18px var(--serif);display:block}
.cards3{display:grid;gap:12px;margin-top:10px}
.cards3 .card{display:grid;grid-template-columns:110px 1fr;flex:none}
.cards3 .card .ph{aspect-ratio:auto;height:100%}
#ov6{justify-content:flex-start}

#nav{position:fixed;inset:0 0 auto;z-index:10;display:flex;align-items:center;gap:20px;padding:16px 6vw}
#nav .nm{font:600 20px var(--serif);margin-right:auto}
#nav .links{display:flex;gap:20px}
#nav .links button{font-size:13px;color:#cfe3df;opacity:.75}
#nav .links button:hover,#nav .links button.on{opacity:1;color:var(--acc2)}
.lang{display:flex;border:1px solid rgba(126,232,210,.45);border-radius:99px;overflow:hidden}
.lang button{padding:5px 11px;font-size:12px}
.lang button.on{background:var(--acc);color:#fff}
.btn{padding:8px 16px;border-radius:99px;background:var(--acc);color:#fff;font-weight:600;font-size:13px}
@media(max-width:900px){#nav .links{display:none}}
#bar{position:fixed;top:0;left:0;height:2px;background:var(--acc2);z-index:11;width:0}
.dots{position:fixed;right:22px;top:50%;transform:translateY(-50%);z-index:10;display:grid;gap:12px}
.dots button{width:8px;height:8px;border-radius:50%;background:rgba(126,232,210,.3);transition:.3s}
.dots button.on{background:var(--acc2);transform:scale(1.5)}

@media(max-width:800px){
  .ov{padding:80px 20px 40px;align-items:flex-end}.ov.right{justify-content:flex-start}
  .col{background:rgba(7,21,25,.72);backdrop-filter:blur(10px);padding:20px;border-radius:18px;max-width:none;width:100%}
  #ov0 .col{background:none;backdrop-filter:none;padding:0}
  .stats{gap:18px}.stats b{font-size:34px}.dots{display:none}
  .card{flex-basis:200px}

#lb{position:fixed;inset:0;z-index:100;background:rgba(5,12,15,.95);display:none;align-items:center;justify-content:center;flex-direction:column;padding:30px}
#lb.on{display:flex}
#lb img{max-width:94vw;max-height:82vh;border-radius:6px;object-fit:contain;background:#fff}
#lb p{color:#d6e8e4;margin-top:14px;font-size:15px;text-align:center;max-width:800px}
#lb .x{position:absolute;top:14px;right:20px;font-size:34px;color:#fff}
#lb .ar{position:absolute;top:50%;font-size:44px;color:#fff;opacity:.7;padding:20px}
#lb .pv{left:6px}#lb .nx{right:6px}
#pres{position:fixed;left:50%;bottom:18px;transform:translate(-50%,160%);z-index:60;display:flex;align-items:center;gap:14px;background:rgba(7,21,25,.95);padding:10px 12px 10px 20px;border-radius:99px;border:1px solid rgba(126,232,210,.2);transition:.4s}
#pres.on{transform:translate(-50%,0)}
#pres .clock{font:600 22px var(--sans);font-variant-numeric:tabular-nums;color:var(--acc2);min-width:62px}
#pres .clock.warn{color:#ff8a65}
#pres .step{font-size:13px;white-space:nowrap;max-width:220px;overflow:hidden;text-overflow:ellipsis}
#pres .step small{display:block;color:var(--mute);font-size:11px}
#pres button{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.08)}
#pres button:hover{background:var(--acc)}
</style>

const CRIT=[[["Функционалдық сауаттылық","Функциональная грамотность"],["Химия — күнделікті өмірмен байланыста; PISA конференциясы, 2024","Химия в связи с жизнью; конференция по PISA, 2024"]],

let lang="kz";try{const s=localStorage.getItem("lang");if(s==="ru"||s==="kz")lang=s}catch(e){}

  $("#tl").innerHTML=TL.map(x=>`<div class="it"><b style="font-size:24px">${x[0]}</b><div><h3 style="font-size:21px">${x[1][K]}</h3></div></div>`).join("");
  $("#thumbs").innerHTML=EV.map(e=>`<img class="z" src="img/${e[0]}.jpg" data-title="${q(e[1][K])}" alt="${q(e[1][K])}">`).join("");
  $("#strip").innerHTML=AW.map((a,i)=>`<div class="card"><div class="ph"><img class="z" src="img/a${pad(i)}.jpg" data-title="${a[1]} · ${q(a[2+K])}" alt=""></div><div class="cap"><b><span>${t.L[a[0]]}</span><span>${a[1]}</span></b>${a[2+K]}</div></div>`).join("");
  $("#gS").innerHTML=ST.map((s,i)=>`<div class="card"><div class="ph"><img class="z" src="img/st${i+1}.jpg" data-title="${s[0]} — ${q(s[5][K])}" alt=""></div><div class="cap"><b><span>${s[3][K]} · ${t.L[s[2]]}</span><span>${s[4]}</span></b><strong>${s[0]}</strong>${s[1]?s[1]+" "+t.cls+" · ":""}${s[5][K]}</div></div>`).join("");
  $$("[data-go]").forEach(b=>b.onclick=()=>go(+b.dataset.go));
  if(presOn)pUpd();
}
$$(".lang button").forEach(b=>b.onclick=()=>{lang=b.dataset.l;try{localStorage.setItem("lang",lang)}catch(e){}render()});

/* overlays follow the 3D progress (window.__G from scene3d.js; fallback = raw scroll) */
const sm=(a,b,v)=>{const x=Math.min(1,Math.max(0,(v-a)/(b-a)));return x*x*(3-2*x)};
function rawG(){const y=scrollY;for(let i=0;i<chaps.length;i++){const a=chaps[i].offsetTop,b=i<chaps.length-1?chaps[i+1].offsetTop:a+chaps[i].offsetHeight-innerHeight;if(y<b||i===chaps.length-1)return i+Math.min(1,Math.max(0,(y-a)/Math.max(1,b-a)))}return 0}
let lastK=-1;
(function loop(){
  const G=window.__G!==undefined&&document.documentElement.classList.contains("gl-on")?window.__G:rawG();
  const k=Math.min(ovs.length-1,Math.floor(G)),u=G-k;
  ovs.forEach((o,i)=>{let op=0;if(i===k){const fin=i===0?1:sm(.12,.24,u),fout=i===ovs.length-1?1:1-sm(.72,.8,u);op=fin*fout}
    o.style.opacity=op.toFixed(3);o.style.visibility=op>0.01?"visible":"hidden";o.classList.toggle("live",op>.5);
    o.style.transform=`translateY(${((1-op)*(i===k&&u>.5?-30:30)).toFixed(1)}px)`});
  const v=sm(.18,.62,u),its=ovs[k].querySelectorAll(".it");its.forEach((e,j)=>e.classList.toggle("on",v>=j/its.length-.001&&u>.14));
  if(k===4){const s=$("#strip"),max=Math.max(0,s.scrollWidth-innerWidth+innerWidth*.12);s.style.transform=`translateX(${(-max*sm(.2,.72,u)).toFixed(1)}px)`}
  if(k!==lastK){$$("#dots button").forEach((b,i)=>b.classList.toggle("on",i===k));$$("#links button").forEach(b=>b.classList.toggle("on",+b.dataset.go===k));lastK=k;if(presOn){cur=k;pUpd()}}
  $("#bar").style.width=(scrollY/(document.documentElement.scrollHeight-innerHeight)*100)+"%";
  requestAnimationFrame(loop)})();

/* lightbox */
let lbList=[],lbI=0;
function lbShow(){const e=lbList[lbI];$("#lbI").src=e.src;$("#lbT").textContent=e.dataset.title||"";$("#lb").classList.add("on")}
function lbClose(){$("#lb").classList.remove("on")}
document.addEventListener("click",e=>{const c=e.target.closest(".card");const z=c?c.querySelector("img.z"):(e.target.matches("img.z")?e.target:null);if(!z)return;
  const scope=z.closest("#strip,#gS,#thumbs");lbList=scope?[...scope.querySelectorAll("img.z")]:[z];lbI=lbList.indexOf(z);lbShow()});
$("#lb .x").onclick=lbClose;$("#lb").onclick=e=>{if(e.target.id==="lb")lbClose()};
$("#lb .pv").onclick=()=>{lbI=(lbI-1+lbList.length)%lbList.length;lbShow()};$("#lb .nx").onclick=()=>{lbI=(lbI+1)%lbList.length;lbShow()};

/* navigation + 5-minute mode */
function go(i){cur=Math.max(0,Math.min(chaps.length-1,i));const c=chaps[cur],nx=chaps[cur+1];const span=(nx?nx.offsetTop:c.offsetTop+c.offsetHeight-innerHeight)-c.offsetTop;
  scrollTo({top:c.offsetTop+(cur===0?0:span*.48),behavior:"smooth"});if(presOn)pUpd()}
function pUpd(){$("#pStep").innerHTML=`${cur+1}/${chaps.length} · ${T[lang].nav[cur]}<small>≈ ${chaps[cur].dataset.sec} сек</small>`}
const fmt=s=>Math.floor(s/60)+":"+String(s%60).padStart(2,"0");
function presStart(){presOn=true;left=300;$("#pres").classList.add("on");$("#clock").textContent=fmt(left);$("#clock").classList.remove("warn");go(0);
  clearInterval(tick);tick=setInterval(()=>{left--;$("#clock").textContent=left>=0?fmt(left):"−"+fmt(-left);$("#clock").classList.toggle("warn",left<=30)},1000)}
function presEnd(){presOn=false;clearInterval(tick);$("#pres").classList.remove("on")}
$("#presBtn").onclick=()=>presOn?presEnd():presStart();
$("#pNext").onclick=()=>go(cur+1);$("#pPrev").onclick=()=>go(cur-1);$("#pEnd").onclick=presEnd;
addEventListener("keydown",e=>{if($("#lb").classList.contains("on")){if(e.key==="Escape")lbClose();if(e.key==="ArrowRight")$("#lb .nx").click();if(e.key==="ArrowLeft")$("#lb .pv").click();return}
  if(!presOn)return;if(["ArrowDown","PageDown"," ","ArrowRight"].includes(e.key)){e.preventDefault();go(cur+1)}if(["ArrowUp","PageUp","ArrowLeft"].includes(e.key)){e.preventDefault();go(cur-1)}if(e.key==="Escape")presEnd()});
render();
</script>
<script type="module" src="scene3d.js"></script>
</body>
